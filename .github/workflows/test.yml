name: 🧪 Test

# Both jobs need the preprod secrets, which a push to a fork can never carry, so
# a fork PR gets no push event in this repository and its required checks would
# wait forever. Fork PRs run through pull_request_target instead, which uses this
# file and the secrets from the base repository, gated per run through the
# preprod-tests environment: the run waits until one of its required reviewers
# approves it in the Actions UI, and every new push queues a fresh run that
# waits for its own approval. Same-repo pushes use no environment at all, so
# they keep running unattended.
on:
  push:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target tokens default to write access, which reviewed-but-foreign
# code must not hold.
permissions:
  contents: read

jobs:
  # The no-drift tests in spacelift/migrationtest verify that a resource moved to the
  # Plugin Framework produces state identical to the last SDKv2 release. They stand up
  # state with a published provider release, so unlike the rest of the suite they cannot
  # set IsUnitTest and genuinely need TF_ACC. The "Test the code" job below runs ./...
  # without TF_ACC, which means these tests skip there — hence a job of their own.
  migration-drift:
    name: Verify migrated resources produce no state drift
    runs-on: ubuntu-latest
    # Same-repo branches already run through the push event, so the gated path
    # only applies to pull requests whose head lives in a fork.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name != github.repository
    environment: ${{ github.event_name == 'pull_request_target' && 'preprod-tests' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Empty on push. On a fork PR this is the commit under review:
          # pull_request_target checks out the base branch by default, which
          # would test the wrong code.
          ref: ${{ github.event.pull_request.head.sha }}
          # Deliberate: fork code only runs after a required reviewer of the
          # preprod-tests environment approves this exact run, which is the
          # human gate this opt-in asks for.
          allow-unsafe-pr-checkout: true

      - name: Install Go
        uses: actions/setup-go@v7
        with: { go-version-file: go.mod }

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1"
          terraform_wrapper: false

      - name: Run the no-drift verification tests
        run: go test -parallel 10 -timeout 30m -v ./spacelift/migrationtest/
        if: github.actor != 'dependabot[bot]'
        env:
          # These tests download a published provider release from the Spacelift registry,
          # so they are acceptance tests in the strict sense and TF_ACC must be set.
          TF_ACC: "1"
          SPACELIFT_API_KEY_ENDPOINT: ${{ vars.preprod_SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.PREPROD_SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.PREPROD_SPACELIFT_API_KEY_SECRET }}

  deployment:
    name: Test the code
    runs-on: ubuntu-latest
    # Same-repo branches already run through the push event, so the gated path
    # only applies to pull requests whose head lives in a fork.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name != github.repository
    environment: ${{ github.event_name == 'pull_request_target' && 'preprod-tests' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Empty on push. On a fork PR this is the commit under review:
          # pull_request_target checks out the base branch by default, which
          # would test the wrong code.
          ref: ${{ github.event.pull_request.head.sha }}
          # Deliberate: fork code only runs after a required reviewer of the
          # preprod-tests environment approves this exact run, which is the
          # human gate this opt-in asks for.
          allow-unsafe-pr-checkout: true

      - name: Install Go
        uses: actions/setup-go@v7
        with: { go-version-file: go.mod }

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1"
          terraform_wrapper: false

      - name: Test with coverage
        run: go test -parallel 40 -timeout 30m -coverprofile=coverage.txt -coverpkg=./... ./...
        if: github.actor != 'dependabot[bot]'
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ vars.preprod_SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.PREPROD_SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.PREPROD_SPACELIFT_API_KEY_SECRET }}
          SPACELIFT_PROVIDER_TEST_IPS: ${{ secrets.PREPROD_SPACELIFT_PROVIDER_TEST_IPS }}
          SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_NAME: "Azure DevOps Default"
          SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_ID: "azure-devops-default"
          SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_PERSONALACCESSTOKEN: "azure-devops"
          SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_USERFACINGHOST: "https://azure-devops-default"
          SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_ORGANIZATIONURL: ${{ secrets.COMMON_SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_ORGANIZATIONURL }}
          SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_WEBHOOKSECRET: ${{ secrets.PREPROD_SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_WEBHOOKSECRET }}
          SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_WEBHOOKURL: ${{ secrets.PREPROD_SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_WEBHOOKURL }}
          SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_VCSCHECKS: "INDIVIDUAL"
          SPACELIFT_PROVIDER_TEST_SOURCECODE_AZUREDEVOPS_DEFAULT_USEGITCHECKOUT: "false"
